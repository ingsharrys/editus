# Transmisiones en vivo de la app del editor: LiveKit (salas WebRTC) + Egress
# (compone la escena con la plantilla y la envía por RTMP a Facebook) + Redis.
# Ver README.md de esta carpeta para la instalación paso a paso.
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    network_mode: host
    command: ["redis-server", "--bind", "127.0.0.1", "--port", "6379", "--save", "", "--appendonly", "no"]

  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    network_mode: host
    command: ["--config", "/etc/livekit.yaml"]
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    depends_on:
      - redis

  egress:
    image: livekit/egress:latest
    restart: unless-stopped
    network_mode: host
    environment:
      - EGRESS_CONFIG_FILE=/etc/egress.yaml
    volumes:
      - ./egress.yaml:/etc/egress.yaml:ro
      - /tmp/livekit-egress:/out
    cap_add:
      - SYS_ADMIN
    shm_size: "1gb"
    depends_on:
      - redis
      - livekit
