<!doctype html>
<html lang="es" class="notranslate" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<title>Escena en vivo</title>
<!--
  Escena que compone el egress de LiveKit (lo que ve la audiencia), en tiempo real.
  Recibe ?url=&token= del egress, entra a la sala como participante oculto y compone
  las cámaras según la metadata de la sala (plantilla + escena):

    plantilla (marca): logo (texto o imagen, izquierda/derecha), fondo, tema y fuente de
      los textos, superposición (prediseñada o PNG), cintillo con etiqueta y título, pie,
      hashtag, marco PNG, desvanecer al mostrar/ocultar, nombres en las cámaras.
    escena: layout (solo|dos|cuadricula|lider|lateral|barra|pip|cine), principal, visibles,
      nombres por cámara y rótulo, banner (fijo o cinta), comentario destacado, widgets
      (reloj, cuenta regresiva), recurso a pantalla completa (video en bucle o no, imagen o
      pantalla prediseñada), efecto de sonido y música de fondo con sus volúmenes.

  Avisa al egress con console.log('START_RECORDING') / 'END_RECORDING'.
  ?monitor=1: la misma escena para el estudio, sin audio (evita el eco).
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&family=Playfair+Display:wght@700;800&family=Montserrat:wght@600;700;800&family=Oswald:wght@500;600;700&family=Roboto+Slab:wght@600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 100vw; height: 100vh; background: #000; overflow: hidden; font-family: Inter, system-ui, sans-serif; }
  /* La escena se diseña a 1280×720 y se escala al tamaño real de salida (720p o 1080p) */
  #escenario { --marca: #C8102E; --marca-txt: #fff; --fuente: Inter, system-ui, sans-serif; --titulo: 'Playfair Display', serif;
    position: absolute; left: 0; top: 0; width: 1280px; height: 720px; transform-origin: 0 0; overflow: hidden; font-family: var(--fuente); }
  #fondo { position: absolute; inset: 0; background: linear-gradient(160deg, #18345a, #0b1c33); background-size: cover; background-position: center; transition: background .6s; }
  #lienzo { position: absolute; inset: 0; z-index: 0; }
  #audios { display: none; }
  .celda { position: absolute; overflow: hidden; background: #000; transition: left .35s ease, top .35s ease, width .35s ease, height .35s ease, border-radius .35s; }
  .celda video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .celda.pantalla video, .celda.contener video { object-fit: contain; background: #000; }
  .celda .nombre { position: absolute; left: 10px; bottom: 10px; max-width: calc(100% - 20px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    padding: 4px 10px; border-radius: 6px; background: var(--marca); color: var(--marca-txt); font-size: 15px; font-weight: 700; transition: opacity .3s; }
  .celda.chica .nombre { font-size: 12px; padding: 2px 7px; left: 6px; bottom: 6px; }
  #espera { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 34px; font-weight: 700; }
  .nada { display: none !important; }
  /* Mostrar / ocultar (con desvanecer si la marca lo pide) */
  .capa { transition: opacity 0s, transform 0s; }
  #escenario.suave .capa { transition: opacity .45s ease, transform .45s ease; }
  .oculto { opacity: 0 !important; visibility: hidden; }
  #escenario.suave .oculto { visibility: visible; pointer-events: none; }
  #sombra { position: absolute; left: 0; right: 0; bottom: 0; height: 46%; background: linear-gradient(to top, rgba(0,0,0,.8), rgba(0,0,0,0)); pointer-events: none; }
  #logo { position: absolute; left: 40px; top: 32px; display: flex; align-items: center; gap: 4px; }
  #logo.der { left: auto; right: 40px; }
  #logo img { height: 64px; max-width: 300px; object-fit: contain; filter: drop-shadow(1px 1px 2px rgba(0,0,0,.45)); }
  #logo .caja { width: 44px; height: 44px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 26px; }
  #logo .resto { font-weight: 700; font-size: 26px; margin-left: 8px; }
  #esquina { position: absolute; right: 40px; top: 36px; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  #escenario.logo-der #esquina { right: auto; left: 40px; align-items: flex-start; }
  #vivo { display: flex; align-items: center; gap: 10px; background: rgba(0,0,0,.55); border-radius: 8px; padding: 8px 14px; color: #fff; font-weight: 800; font-size: 20px; letter-spacing: 2px; }
  #vivo i { width: 12px; height: 12px; border-radius: 50%; background: #e11d48; animation: latir 1.2s infinite; }
  #reloj { background: rgba(0,0,0,.55); color: #fff; border-radius: 8px; padding: 6px 12px; font-weight: 700; font-size: 20px; font-variant-numeric: tabular-nums; }
  @keyframes latir { 0%,100% { opacity: 1 } 50% { opacity: .25 } }
  #cuenta { position: absolute; left: 50%; top: 30px; transform: translateX(-50%); display: flex; align-items: center; gap: 14px; background: var(--marca); color: var(--marca-txt);
    padding: 10px 22px; border-radius: 14px; box-shadow: 0 6px 18px rgba(0,0,0,.35); }
  #cuenta .t { font-size: 18px; font-weight: 700; max-width: 420px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #cuenta .n { font-size: 40px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; }
  #inferior { position: absolute; left: 40px; bottom: 92px; display: flex; flex-direction: column; align-items: flex-start; gap: 12px; max-width: 1000px; }
  #escenario.con-cinta #inferior { bottom: 138px; }
  #cintillo { max-width: 980px; }
  #etiqueta { display: inline-block; padding: 6px 18px; font-weight: 700; font-size: 20px; letter-spacing: 3px; }
  #titulo { font-family: var(--titulo); font-weight: 800; font-size: 44px; line-height: 1.12; margin-top: 10px; text-shadow: 2px 2px 3px rgba(0,0,0,.5); }
  #pie { position: absolute; left: 40px; right: 40px; bottom: 34px; display: flex; justify-content: space-between; color: #fff; font-weight: 600; font-size: 20px; text-shadow: 1px 1px 2px rgba(0,0,0,.6); }
  #escenario.con-cinta #pie { bottom: 80px; }
  /* Rótulo (nombre y cargo de quien está en cuadro) */
  #rotulo { display: flex; align-items: stretch; filter: drop-shadow(2px 2px 3px rgba(0,0,0,.45)); }
  #rotulo .barra { width: 10px; background: var(--marca); }
  #rotulo .textos { background: rgba(255,255,255,.96); padding: 8px 22px 9px 16px; }
  #rotulo .nombre { font-weight: 800; font-size: 27px; line-height: 1.1; color: #111; }
  #rotulo .cargo { font-weight: 600; font-size: 17px; letter-spacing: 1px; color: #444; text-transform: uppercase; margin-top: 2px; }
  /* Banner (texto destacado) */
  #banner { display: flex; flex-direction: column; max-width: 1000px; filter: drop-shadow(2px 3px 4px rgba(0,0,0,.35)); }
  #banner .bt { align-self: flex-start; background: var(--marca); color: var(--marca-txt); font-weight: 800; font-size: 17px; letter-spacing: 1.5px; text-transform: uppercase; padding: 5px 14px; }
  #banner .bx { background: #fff; color: #111; font-weight: 700; font-size: 28px; line-height: 1.2; padding: 12px 20px; }
  /* Comentario destacado */
  #comentario { display: flex; align-items: flex-start; gap: 14px; background: #fff; color: #111; border-radius: 14px; padding: 14px 20px 14px 14px; max-width: 760px;
    box-shadow: 0 8px 22px rgba(0,0,0,.35); border-left: 8px solid var(--marca); }
  #comentario img { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; background: #ddd; flex: none; }
  #comentario .cn { font-weight: 800; font-size: 19px; display: flex; align-items: center; gap: 8px; }
  #comentario .red { font-size: 12px; font-weight: 800; color: #fff; border-radius: 4px; padding: 2px 6px; letter-spacing: .5px; }
  #comentario .ct { font-weight: 500; font-size: 23px; line-height: 1.25; margin-top: 2px; }
  /* Cinta que corre (ticker) */
  #cinta { position: absolute; left: 0; right: 0; bottom: 0; height: 58px; display: flex; align-items: stretch; background: rgba(255,255,255,.97); overflow: hidden; }
  #cinta .ct-et { flex: none; display: flex; align-items: center; padding: 0 20px; background: var(--marca); color: var(--marca-txt); font-weight: 800; font-size: 19px; letter-spacing: 2px; text-transform: uppercase; z-index: 1; }
  #cinta .ct-via { position: relative; flex: 1; overflow: hidden; }
  #cinta .ct-txt { position: absolute; top: 0; height: 58px; display: flex; align-items: center; white-space: nowrap; color: #111; font-weight: 700; font-size: 24px; will-change: transform; animation: correr linear infinite; }
  @keyframes correr { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  /* Temas */
  .tema-burbuja #banner .bt { border-radius: 999px 999px 999px 0; padding: 5px 16px; }
  .tema-burbuja #banner .bx { border-radius: 0 22px 22px 22px; }
  .tema-burbuja #rotulo .barra { border-radius: 14px 0 0 14px; }
  .tema-burbuja #rotulo .textos { border-radius: 0 14px 14px 0; }
  .tema-burbuja .celda .nombre { border-radius: 999px; padding: 4px 14px; }
  .tema-burbuja #cinta { left: 24px; right: 24px; bottom: 14px; border-radius: 999px; }
  .tema-minimal #banner .bt { background: transparent; color: #fff; padding: 0 0 4px; text-shadow: 1px 1px 2px rgba(0,0,0,.6); }
  .tema-minimal #banner .bx { background: rgba(0,0,0,.62); color: #fff; border-left: 6px solid var(--marca); }
  .tema-minimal #rotulo .textos { background: rgba(0,0,0,.62); }
  .tema-minimal #rotulo .nombre { color: #fff; } .tema-minimal #rotulo .cargo { color: #ddd; }
  .tema-minimal .celda .nombre { background: rgba(0,0,0,.62); color: #fff; }
  .tema-minimal #comentario { background: rgba(0,0,0,.7); color: #fff; }
  .tema-minimal #cinta { background: rgba(0,0,0,.72); } .tema-minimal #cinta .ct-txt { color: #fff; }
  .tema-bloque #banner .bt, .tema-bloque #banner .bx { text-transform: uppercase; }
  .tema-bloque #banner .bx { background: var(--marca); color: var(--marca-txt); font-weight: 800; border: 4px solid #fff; }
  .tema-bloque #banner .bt { background: #111; color: #fff; }
  .tema-bloque #rotulo .textos { background: var(--marca); } .tema-bloque #rotulo .barra { background: #111; }
  .tema-bloque #rotulo .nombre, .tema-bloque #rotulo .cargo { color: var(--marca-txt); text-transform: uppercase; }
  .tema-bloque .celda .nombre { border-radius: 0; text-transform: uppercase; }
  /* Superposiciones (prediseñadas o PNG) y marco PNG sobre el video, debajo de los textos */
  #marco, #superposicion img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: fill; pointer-events: none; }
  #superposicion { position: absolute; inset: 0; pointer-events: none; }
  .sp { position: absolute; display: flex; align-items: center; gap: 12px; font-weight: 800; color: #fff; }
  .sp-suscribete { right: 40px; bottom: 150px; background: #fff; color: #111; border-radius: 999px; padding: 10px 22px 10px 10px; font-size: 22px; box-shadow: 0 8px 20px rgba(0,0,0,.35); animation: saltar 2.4s ease-in-out infinite; }
  .sp-suscribete .ic { width: 44px; height: 44px; border-radius: 50%; background: var(--marca); color: var(--marca-txt); display: flex; align-items: center; justify-content: center; font-size: 22px; }
  @keyframes saltar { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-8px) } }
  .sp-bienvenidos { left: 0; right: 0; top: 260px; justify-content: center; }
  .sp-bienvenidos span { background: var(--marca); color: var(--marca-txt); font-size: 64px; letter-spacing: 2px; padding: 14px 44px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,.4); transform: rotate(-2deg); }
  .sp-preguntas { left: 40px; top: 120px; background: var(--marca); color: var(--marca-txt); padding: 10px 20px; border-radius: 12px; font-size: 24px; }
  .sp-preguntas b { width: 38px; height: 38px; border-radius: 50%; background: #fff; color: var(--marca); display: flex; align-items: center; justify-content: center; font-size: 26px; }
  .sp-ultima { left: 0; top: 118px; }
  .sp-ultima span:first-child { background: #e11d48; padding: 10px 22px 10px 40px; font-size: 28px; letter-spacing: 3px; animation: latir 1.6s infinite; }
  .sp-ultima span:last-child { background: rgba(0,0,0,.75); padding: 10px 22px; font-size: 24px; margin-left: -12px; }
  .sp-logro { right: 40px; top: 120px; flex-direction: column; align-items: center; gap: 6px; background: linear-gradient(160deg, #fbbf24, #f59e0b); color: #111; padding: 16px 26px; border-radius: 18px; font-size: 22px; box-shadow: 0 10px 26px rgba(0,0,0,.35); }
  .sp-logro .tr { font-size: 46px; line-height: 1; }
  .sp-redes { left: 50%; transform: translateX(-50%); top: 30px; background: rgba(0,0,0,.6); padding: 8px 20px; border-radius: 999px; font-size: 20px; }
  .sp-redes i { font-style: normal; background: var(--marca); color: var(--marca-txt); border-radius: 6px; padding: 2px 8px; }
  /* Recurso a pantalla completa (clip, imagen o pantalla prediseñada) */
  #recurso { position: absolute; inset: 0; background: #000; z-index: 50; display: flex; align-items: center; justify-content: center; }
  #recurso img, #recurso video { width: 100%; height: 100%; object-fit: contain; }
  .pantalla-p { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; color: #fff; text-align: center;
    background: radial-gradient(1200px 600px at 20% 10%, rgba(255,255,255,.18), transparent 60%), linear-gradient(140deg, var(--marca), #0b1c33 75%); }
  .pantalla-p .pl img { height: 90px; max-width: 420px; object-fit: contain; }
  .pantalla-p .pt { font-size: 66px; font-weight: 800; line-height: 1.08; max-width: 1050px; text-shadow: 0 4px 18px rgba(0,0,0,.35); }
  .pantalla-p .ps { font-size: 28px; font-weight: 600; opacity: .9; max-width: 1000px; }
  .pantalla-p .pc { font-size: 120px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; }
  .pantalla-p .anillo { width: 260px; height: 260px; border-radius: 50%; border: 10px solid rgba(255,255,255,.25); border-top-color: #fff; display: flex; align-items: center; justify-content: center; animation: girar 1.4s linear infinite; }
  .pantalla-p .anillo .pc { animation: girar 1.4s linear infinite reverse; }
  @keyframes girar { to { transform: rotate(360deg); } }
  .pantalla-p .ondas { position: absolute; inset: auto 0 0 0; height: 160px; opacity: .35; background: repeating-linear-gradient(90deg, rgba(255,255,255,.25) 0 2px, transparent 2px 26px); animation: deslizar 6s linear infinite; }
  @keyframes deslizar { to { background-position: 260px 0; } }
  /* Formato "mitad": las cámaras a la izquierda (escaladas) y la publicidad a la derecha */
  #escenario.mitad #lienzo { transform: scale(0.5); transform-origin: 0 50%; }
  #escenario.mitad #recurso { inset: 0 0 0 640px; }
  #escenario.mitad #inferior, #escenario.mitad #cintillo { max-width: 560px; }
  #escenario.mitad #titulo { font-size: 32px; }
</style>
</head>
<body>
<div id="escenario" class="tema-clasico">
  <div id="fondo"></div>
  <div id="lienzo"></div>
  <div id="espera">Esperando la cámara…</div>
  <img id="marco" class="nada" alt="">
  <div id="superposicion" class="capa oculto"></div>
  <div id="sombra" class="capa"></div>
  <div id="logo" class="capa"></div>
  <div id="esquina"><div id="vivo" class="capa"><i></i>EN VIVO</div><div id="reloj" class="capa oculto"></div></div>
  <div id="cuenta" class="capa oculto"><span class="t"></span><span class="n">00:00</span></div>
  <div id="inferior">
    <div id="rotulo" class="capa oculto"><div class="barra"></div><div class="textos"><div class="nombre"></div><div class="cargo"></div></div></div>
    <div id="comentario" class="capa oculto"><img alt=""><div><div class="cn"><span class="nm"></span><span class="red"></span></div><div class="ct"></div></div></div>
    <div id="banner" class="capa oculto"><div class="bt"></div><div class="bx"></div></div>
    <div id="cintillo" class="capa"><span id="etiqueta"></span><div id="titulo"></div></div>
  </div>
  <div id="cinta" class="capa oculto"><div class="ct-et"></div><div class="ct-via"><div class="ct-txt"></div></div></div>
  <div id="pie" class="capa"><span id="pie-izq"></span><span id="pie-der"></span></div>
  <div id="recurso" class="capa oculto"></div>
</div>
<div id="audios"></div>

  <script src="https://cdn.jsdelivr.net/npm/livekit-client@2/dist/livekit-client.umd.min.js"></script>
  <script src="sonidos.js"></script>
  <script>
    // Escalar el diseño 1280×720 a la ventana real (el egress abre Chrome al tamaño de salida)
    function escalar() {
      const k = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
      const e = document.getElementById('escenario');
      e.style.transform = 'translate(' + ((window.innerWidth - 1280 * k) / 2) + 'px,' + ((window.innerHeight - 720 * k) / 2) + 'px) scale(' + k + ')';
    }
    window.addEventListener('resize', escalar); escalar();

    const q = new URLSearchParams(location.search);
    const url = q.get('url'); const token = q.get('token');
    // Monitor de programa (estudio y app): misma escena, pero sin audio (evita el eco con el micrófono)
    const MONITOR = q.get('monitor') === '1';
    // ?sonido=1: monitor CON audio (la página del invitado, para oír la transmisión con música y
    // efectos); ?yo=identity: no se reproduce el propio micrófono de quien mira (sin eco)
    const MUDO = MONITOR && q.get('sonido') !== '1';
    const YO = q.get('yo') || '';
    const PRINCIPAL = 'camara-principal';
    const CUPOS = { solo: 1, dos: 2, pip: 2, cuadricula: 6, lider: 4, lateral: 2, barra: 5, cine: 1 };
    const $ = (id) => document.getElementById(id);
    const ver = (el, on) => el.classList.toggle('oculto', !on);

    // Fondos prediseñados (sin archivos)
    const FONDOS = {
      noche: 'linear-gradient(160deg, #18345a, #0b1c33)',
      'olas-azules': 'radial-gradient(120% 80% at 10% 110%, #60a5fa 0 30%, transparent 31%), radial-gradient(110% 70% at 90% -10%, #1d4ed8 0 35%, transparent 36%), linear-gradient(135deg, #1e3a8a, #2563eb 55%, #93c5fd)',
      'montanas-negras': 'linear-gradient(160deg, transparent 0 55%, rgba(255,255,255,.05) 55% 56%, transparent 56%), linear-gradient(20deg, transparent 0 60%, rgba(255,255,255,.06) 60% 61%, transparent 61%), linear-gradient(180deg, #111 0%, #000 100%)',
      'olas-moradas': 'radial-gradient(90% 60% at 80% 100%, #c4b5fd 0 35%, transparent 36%), radial-gradient(80% 60% at 10% 0%, #a78bfa 0 30%, transparent 31%), linear-gradient(135deg, #7c3aed, #a78bfa 60%, #ddd6fe)',
      'cielo-cian': 'linear-gradient(160deg, #a5f3fc, #22d3ee 45%, #0ea5e9)',
      'olas-cian': 'repeating-linear-gradient(115deg, rgba(255,255,255,.12) 0 40px, transparent 40px 110px), linear-gradient(135deg, #0891b2, #22d3ee)',
      'azul-rosa': 'linear-gradient(120deg, #3b82f6, #a855f7 50%, #f43f5e)',
      'morado-fucsia': 'linear-gradient(120deg, #4c1d95, #c026d3 55%, #db2777)',
      'cian-verde': 'linear-gradient(120deg, #22d3ee, #34d399 60%, #a3e635)',
      estudio: 'radial-gradient(70% 70% at 50% 40%, #3f3f46, #09090b)',
      blanco: 'linear-gradient(160deg, #ffffff, #e5e7eb)',
    };
    const FUENTES = {
      inter: ['Inter, system-ui, sans-serif', "'Playfair Display', serif"],
      montserrat: ['Montserrat, sans-serif', 'Montserrat, sans-serif'],
      oswald: ['Oswald, sans-serif', 'Oswald, sans-serif'],
      poppins: ['Poppins, sans-serif', 'Poppins, sans-serif'],
      slab: ["'Roboto Slab', serif", "'Roboto Slab', serif"],
      playfair: ["'Playfair Display', serif", "'Playfair Display', serif"],
    };
    // Superposiciones prediseñadas: HTML con el color de la marca
    const SUPERPOSICIONES = {
      suscribete: (t) => '<div class="sp sp-suscribete"><span class="ic">👍</span>' + esc(t || 'Dale me gusta y comparte') + '</div>',
      bienvenidos: (t) => '<div class="sp sp-bienvenidos"><span>' + esc(t || '¡Bienvenidos!') + '</span></div>',
      preguntas: (t) => '<div class="sp sp-preguntas"><b>?</b>' + esc(t || 'Preguntas y respuestas') + '</div>',
      ultima: (t) => '<div class="sp sp-ultima"><span>ÚLTIMA HORA</span><span>' + esc(t || 'Información en desarrollo') + '</span></div>',
      logro: (t) => '<div class="sp sp-logro"><span class="tr">🏆</span>' + esc(t || '¡Gracias por su apoyo!') + '</div>',
      redes: (t) => '<div class="sp sp-redes">Síguenos <i>' + esc(t || '@tumedio') + '</i></div>',
    };
    const PANTALLAS = {
      pronto: { t: 'La transmisión comenzará pronto', s: '' },
      enseguida: { t: 'Volvemos enseguida', s: 'No te vayas' },
      gracias: { t: '¡Gracias por acompañarnos!', s: 'Síguenos para la próxima transmisión' },
      temporizador: { t: '', s: '' },
    };
    // Vista previa sin sala (?demo=<metadata JSON>&falsas=Nombre1,Nombre2): para revisar diseños
    const FALSAS = new Map((q.get('falsas') || '').split(',').filter(Boolean).map((n, i) => [i === 0 ? 'camara-principal' : (n.startsWith('Pantalla') ? 'camara-principal#pantalla' : 'invitado-' + i), n]));
    const RED = { facebook: ['Facebook', '#1877F2'], youtube: ['YouTube', '#FF0000'] };

    function esc(t) { return String(t ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
    function contraste(hex) {
      const m = /^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(hex || '');

      const l = (0.299 * parseInt(m[1], 16) + 0.587 * parseInt(m[2], 16) + 0.114 * parseInt(m[3], 16)) / 255;

    // ----------------------------------------------------------- audio (efectos y música)
    let actx = null, gEfectos = null, gMusica = null;
    function audio() {
      if (MUDO || !window.EditusAudio) return null;
      if (!actx) {
        try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; }
        gEfectos = actx.createGain(); gEfectos.connect(actx.destination);

      if (actx.state === 'suspended') actx.resume().catch(() => {});

    let volEfectos = 0.8, volMusica = 0.35;
    const sonados = new Set();
    let elEfecto = null;
    function sonar1(s) {
      if (!s || !s.inicio) return;
      const clave = s.id + ':' + s.inicio;
      if (sonados.has(clave)) return;
      sonados.add(clave);
      if (Date.now() - s.inicio > 8000) return; // ya pasó (alguien entró tarde a la sala)
      if (MUDO) return;
      if (s.url) {
        try { if (elEfecto) elEfecto.pause(); elEfecto = new Audio(s.url); elEfecto.volume = volEfectos; elEfecto.play().catch(() => {}); } catch (e) {}
      } else if (audio()) { window.EditusAudio.efecto(actx, gEfectos, s.preset || s.id); }
      console.log('escena: sonido ' + (s.preset || s.url));

    let musicaClave = null, musicaSint = null, musicaEl = null;
    function pintarMusica(m) {
      const clave = m ? (m.id + ':' + m.inicio) : null;
      if (clave === musicaClave) return;
      musicaClave = clave;
      if (musicaSint) { musicaSint.detener(); musicaSint = null; }
      if (musicaEl) { const el = musicaEl; musicaEl = null; let v = el.volume; const baja = setInterval(() => { v -= 0.05; if (v <= 0) { clearInterval(baja); el.pause(); el.remove(); } else el.volume = v; }, 60); }
      if (!m || MUDO) return;
      if (m.url) {
        const el = new Audio(m.url); el.loop = m.bucle !== false; el.volume = volMusica; el.preload = 'auto';
        el.onloadedmetadata = () => { const pasado = (Date.now() - (m.inicio || Date.now())) / 1000; if (pasado > 1 && isFinite(el.duration) && el.duration > 0) el.currentTime = el.loop ? pasado % el.duration : Math.min(pasado, el.duration); };
        el.play().catch((e) => console.log('escena: música no sonó ' + (e && e.message)));
        musicaEl = el;

    }
    function volumenes(e) {
      volEfectos = typeof e.vol_sonidos === 'number' ? Math.max(0, Math.min(1, e.vol_sonidos)) : 0.8;
      volMusica = typeof e.vol_musica === 'number' ? Math.max(0, Math.min(1, e.vol_musica)) : 0.35;
      if (gEfectos) gEfectos.gain.value = volEfectos;
      if (gMusica) gMusica.gain.value = volMusica * 1.6;
      if (musicaEl) musicaEl.volume = volMusica;

    let grabando = false;
    function empezar() { if (!grabando) { grabando = true; if (!MONITOR) console.log('START_RECORDING'); } }

    // Posición de cada cámara según el diseño (lienzo de 1280×720)
    function rectangulos(layout, n) {
      const R = (x, y, w, h, extra) => Object.assign({ x, y, w, h, radio: 10 }, extra || {});
      if (n <= 0) return [];
      switch (layout) {
        case 'solo': return [R(0, 0, 1280, 720, { radio: 0 })];
        case 'cine': return [R(0, 0, 1280, 720, { radio: 0, contener: true })];
        case 'pip': return n === 1 ? [R(0, 0, 1280, 720, { radio: 0 })] : [R(0, 0, 1280, 720, { radio: 0 }), R(1280 - 40 - 352, 104, 352, 198, { chica: true, borde: true })];
        case 'dos': {
          if (n === 1) return [R(0, 0, 1280, 720, { radio: 0 })];
          const w = 618, h = Math.round(w * 9 / 16), y = Math.round((720 - h) / 2) - 16;
          return [R(16, y, w, h), R(16 + w + 12, y, w, h)];
        }
        case 'lateral': {
          if (n === 1) return [R(0, 0, 1280, 720, { radio: 0 })];
          const h = 478, w1 = 850, w2 = 380, x0 = Math.round((1280 - w1 - 12 - w2) / 2), y = Math.round((720 - h) / 2) - 16;
          return [R(x0, y, w1, h, { contener: true }), R(x0 + w1 + 12, y, w2, h)];
        }
        case 'lider': {
          if (n === 1) return [R(0, 0, 1280, 720, { radio: 0 })];
          const w = 900, h = 506, sh = Math.round((h - 24) / 3), sw = Math.round(sh * 16 / 9), x0 = Math.round((1280 - w - 12 - sw) / 2), y = Math.round((720 - h) / 2) - 16;
          const out = [R(x0, y, w, h)];
          const k = n - 1, top = y + Math.round((h - (k * sh + (k - 1) * 12)) / 2);
          for (let i = 0; i < k; i++) out.push(R(x0 + w + 12, top + i * (sh + 12), sw, sh, { chica: true }));
          return out;
        }
        case 'barra': {
          if (n === 1) return [R(0, 0, 1280, 720, { radio: 0 })];
          const h = 470, w = Math.round(h * 16 / 9), out = [R(Math.round((1280 - w) / 2), 14, w, h)];
          const k = n - 1, tw = 210, th = 118, x0 = Math.round((1280 - (k * tw + (k - 1) * 10)) / 2);
          for (let i = 0; i < k; i++) out.push(R(x0 + i * (tw + 10), 14 + h + 10, tw, th, { chica: true }));
          return out;
        }
        default: { // cuadrícula (hasta 6)
          if (n === 1) return [R(0, 0, 1280, 720, { radio: 0 })];
          if (n === 2) return rectangulos('dos', 2);
          const cols = n <= 4 ? 2 : 3, filas = Math.ceil(n / cols), gap = 12;
          let w = Math.floor((1248 - gap * (cols - 1)) / cols), h = Math.round(w * 9 / 16);
          const altoMax = 624;
          if (filas * h + (filas - 1) * gap > altoMax) { h = Math.floor((altoMax - gap * (filas - 1)) / filas); w = Math.round(h * 16 / 9); }
          const y0 = Math.round((720 - (filas * h + (filas - 1) * gap)) / 2) - 16, out = [];
          for (let f = 0; f < filas; f++) {
            const enFila = Math.min(cols, n - f * cols), x0 = Math.round((1280 - (enFila * w + (enFila - 1) * gap)) / 2);
            for (let c = 0; c < enFila; c++) out.push(R(x0 + c * (w + gap), y0 + f * (h + gap), w, h, { chica: cols === 3 }));
          }
          return out;
        }
      }
    }

    async function main() {
      const { Room, RoomEvent, Track } = LivekitClient;
      const room = new Room({ adaptiveStream: false, dynacast: false });
      const lienzo = $('lienzo');
      const espera = $('espera');
      let escena = { layout: 'solo', principal: PRINCIPAL, visibles: [] };
      const celdas = new Map(); // identity -> {el, video, track}
      const audios = new Map(); // identity -> {el, track}  (solo suena quien está al aire)
      const audiosDiv = $('audios');

      // Micrófono de cada participante; la pantalla compartida (id#pantalla) usa el micrófono de su dueño
      // y, si existe, el audio de la propia pantalla
      function microfonos() {
        const out = new Map();
        for (const p of room.remoteParticipants.values()) {
          if (YO && p.identity === YO) continue;
          for (const pub of p.audioTrackPublications.values()) {
            if (!pub.track) continue;
            if (pub.source === Track.Source.Microphone) out.set(p.identity, pub.track);
            if (pub.source === Track.Source.ScreenShareAudio) out.set(p.identity + '#pantalla-audio', pub.track);
          }
        }
        return out;
      }
      let silenciarCamaras = false; // mientras suena un clip o hay una pantalla a pantalla completa

      function sonar(alAire) {
        const mics = microfonos();
        const deseadas = new Map();
        for (const id of alAire) {
          const base = id.replace(/#pantalla$/, '');
          if (mics.has(base)) deseadas.set(base, mics.get(base));
          if (id.endsWith('#pantalla') && mics.has(base + '#pantalla-audio')) deseadas.set(base + '#pantalla-audio', mics.get(base + '#pantalla-audio'));
        }
        for (const [id, a] of audios) {
          if (deseadas.get(id) !== a.track) { try { a.track.detach(a.el); } catch (e) {} a.el.remove(); audios.delete(id); }
        }
        for (const [id, track] of deseadas) {
          if (audios.has(id)) continue;
          const el = track.attach(); el.autoplay = true; el.volume = 1;
          audiosDiv.appendChild(el); audios.set(id, { el, track });
          el.play && el.play().catch(() => {});
        }
        for (const a of audios.values()) a.el.muted = silenciarCamaras || MUDO;
      }

      // Recurso a pantalla completa: clip de video (una vez o en bucle), imagen o pantalla prediseñada
      let recursoActual = null, temporizador = null;
      function mostrarRecurso(r) {
        const cont = $('recurso');
        const escenario = $('escenario');
        const clave = r ? (r.id + ':' + r.inicio + ':' + (r.formato || 'completa')) : null;
        if (clave === recursoActual) return;
        recursoActual = clave;
        clearInterval(temporizador); temporizador = null;
        const terminar = () => { ver(cont, false); setTimeout(() => { if (recursoActual === clave || !recursoActual) cont.innerHTML = ''; }, 500); escenario.classList.remove('mitad'); silenciarCamaras = false; sonar(ultimoAlAire); };
        if (!r) { terminar(); return; }
        cont.innerHTML = '';
        escenario.classList.toggle('mitad', r.formato === 'mitad');
        const desfase = r.inicio ? Math.max(0, (Date.now() - r.inicio) / 1000) : 0;
        if (r.tipo === 'pantalla') {
          if (r.duracion && desfase > r.duracion + 1) { terminar(); return; }
          const base = PANTALLAS[r.preset] || PANTALLAS.pronto, p = plantillaActual || {};
          const titulo = (r.texto || '').trim() || base.t;
          const sub = r.preset === 'pronto' ? (p.titulo || '') : base.s;
          const el = document.createElement('div'); el.className = 'pantalla-p';
          el.innerHTML = (p.logo_url ? '<div class="pl"><img src="' + esc(p.logo_url) + '" alt=""></div>' : '')
            + (r.preset === 'temporizador' ? '<div class="anillo"><div class="pc">' + Math.ceil(r.duracion || 10) + '</div></div>' : '<div class="pt">' + esc(titulo) + '</div>')
            + (r.preset === 'temporizador' ? (titulo ? '<div class="ps">' + esc(titulo) + '</div>' : '') : (sub ? '<div class="ps">' + esc(sub) + '</div>' : ''))
            + (r.duracion && r.preset !== 'temporizador' ? '<div class="pc" style="font-size:64px"></div>' : '') + '<div class="ondas"></div>';
          cont.appendChild(el);
          if (r.duracion) {
            const pc = el.querySelector('.pc');
            const tick = () => {
              const resta = r.duracion - (Date.now() - r.inicio) / 1000;
              if (resta <= 0) { if (recursoActual === clave) { recursoActual = null; terminar(); } clearInterval(temporizador); return; }
              if (pc) pc.textContent = r.preset === 'temporizador' ? Math.ceil(resta) : reloj2(resta);
            };
            tick(); temporizador = setInterval(tick, 250);
          }
          silenciarCamaras = true; sonar(ultimoAlAire);
        } else if (r.tipo === 'video') {
          if (r.duracion && desfase > r.duracion + 2 && !r.bucle) { terminar(); return; }
          const v = document.createElement('video'); v.src = r.url; v.autoplay = true; v.playsInline = true; v.preload = 'auto'; v.muted = MUDO; v.loop = !!r.bucle;
          v.onloadedmetadata = () => { if (desfase > 1 && isFinite(v.duration)) v.currentTime = r.bucle ? desfase % v.duration : Math.min(desfase, v.duration); };
          v.onended = () => { console.log('escena: recurso terminó ' + r.nombre); recursoActual = null; terminar(); };
          v.onerror = () => { console.log('escena: no se pudo reproducir ' + r.url); terminar(); };
          cont.appendChild(v); silenciarCamaras = true; sonar(ultimoAlAire);
          v.play && v.play().catch((e) => console.log('escena: play falló ' + (e && e.message)));
        } else {
          if (r.duracion && desfase > r.duracion) { terminar(); return; }
          const img = document.createElement('img'); img.src = r.url; img.onerror = () => console.log('escena: no cargó la imagen ' + r.url);
          cont.appendChild(img);
          if (r.duracion) setTimeout(() => { if (recursoActual === clave) terminar(); }, Math.max(0, r.duracion - desfase) * 1000);
        }
        ver(cont, true);
        empezar(); // con una intro al aire la transmisión arranca aunque aún no haya cámara
        console.log('escena: recurso al aire ' + r.tipo + ' ' + (r.nombre || r.preset) + ' (' + (r.formato || 'completa') + ')');
      }
      let ultimoAlAire = [];

      function leerMetadata() {
        let m = {};
        try { m = JSON.parse(room.metadata || '{}'); } catch (e) { m = {}; }
        const e = m.escena || {};
        escenaActual = { nombres: (e.nombres && typeof e.nombres === 'object') ? e.nombres : {}, rotulo_de: e.rotulo_de || null, rotulo_auto: !!e.rotulo_auto };
        pintar(m);
        escena = {
          layout: CUPOS[e.layout] ? e.layout : 'solo',
          principal: e.principal || PRINCIPAL,
          visibles: Array.isArray(e.visibles) ? e.visibles : [],
          recurso: e.recurso && (e.recurso.url || e.recurso.tipo === 'pantalla') ? e.recurso : null,
          vacio: !!e.vacio,
        };
        pintarBanner(e.banner || null);
        pintarComentario(e.comentario || null);
        widgets = e.widgets || {}; pintarWidgets();
        volumenes(e);
        sonar1(e.sonido || null);
        pintarMusica(e.musica || null);
        componer();
      }

      // Cámara (pista de vídeo) de cada participante conectado que publica; la pantalla compartida entra como id#pantalla
      function camarasDisponibles() {
        const out = new Map();
        for (const [id, nombre] of FALSAS) out.set(id, { falsa: true, track: id, nombre, pantalla: id.endsWith('#pantalla') });
        for (const p of room.remoteParticipants.values()) {
          for (const pub of p.videoTrackPublications.values()) {
            if (!pub.track || pub.isMuted) continue;
            if (pub.source === Track.Source.Camera && !out.has(p.identity)) out.set(p.identity, { track: pub.track, nombre: p.name || p.identity, pantalla: false });
            if (pub.source === Track.Source.ScreenShare) out.set(p.identity + '#pantalla', { track: pub.track, nombre: 'Pantalla de ' + (p.name || p.identity), pantalla: true });
          }
        }
        return out;
      }

      // Quién sale al aire y en qué orden: principal primero, luego los "visibles" elegidos,
      // y si el director no eligió a nadie, el resto de cámaras conectadas (orden de llegada)
      function ordenAlAire(camaras) {
        if (escena.vacio) return []; // el director dejó el escenario vacío
        const cupos = CUPOS[escena.layout];
        const lista = [];
        const meter = (id) => { if (camaras.has(id) && !lista.includes(id) && lista.length < cupos) lista.push(id); };
        meter(escena.principal);
        for (const id of escena.visibles) meter(id);
        if (escena.visibles.length === 0 || lista.length === 0) {
          for (const id of camaras.keys()) meter(id);
        }
        return lista;
      }

      function componer() {
        const camaras = camarasDisponibles();
        const alAire = ordenAlAire(camaras);
        const rects = rectangulos(escena.layout, alAire.length);
        const nombresVisibles = plantillaActual.mostrar_nombres !== false && !['solo', 'cine'].includes(escena.layout) && alAire.length > 1;
        for (const [id, c] of celdas) {
          if (!alAire.includes(id)) { try { c.track.detach && c.track.detach(c.video); } catch (e) {} c.el.remove(); celdas.delete(id); }
        }
        alAire.forEach((id, i) => {
          const cam = camaras.get(id);
          let c = celdas.get(id);
          if (!c || c.track !== cam.track) {
            if (c) { try { c.track.detach && c.track.detach(c.video); } catch (e) {} c.el.remove(); }
            const el = document.createElement('div'); el.className = 'celda' + (cam.pantalla ? ' pantalla' : '');
            let video = document.createElement('video'); video.autoplay = true; video.playsInline = true; video.muted = true;
            if (cam.falsa) { video = document.createElement('div'); video.style.cssText = 'width:100%;height:100%;background:linear-gradient(135deg,hsl(' + (celdas.size * 67 + 200) + ',45%,42%),hsl(' + (celdas.size * 67 + 240) + ',40%,22%))'; }
            else cam.track.attach(video);
            el.appendChild(video);
            const n = document.createElement('span'); n.className = 'nombre'; el.appendChild(n);
            c = { el, video, track: cam.track }; celdas.set(id, c);
            const r0 = rects[i];
            Object.assign(el.style, { left: r0.x + 'px', top: r0.y + 'px', width: r0.w + 'px', height: r0.h + 'px' });
            lienzo.appendChild(el);
          }
          const r = rects[i];
          Object.assign(c.el.style, { left: r.x + 'px', top: r.y + 'px', width: r.w + 'px', height: r.h + 'px', borderRadius: r.radio + 'px', zIndex: r.chica ? 2 : 1,
            boxShadow: r.borde ? '0 0 0 3px #fff, 0 8px 20px rgba(0,0,0,.4)' : (r.radio ? '0 6px 18px rgba(0,0,0,.3)' : 'none') });
          c.el.classList.toggle('chica', !!r.chica);
          c.el.classList.toggle('contener', !!r.contener);
          const pr = persona(id.replace(/#pantalla$/, ''));
          const etiqueta = c.el.querySelector('.nombre');
          etiqueta.textContent = id.endsWith('#pantalla') ? cam.nombre : ((pr && pr.nombre) || cam.nombre);
          etiqueta.classList.toggle('nada', !nombresVisibles);
        });
        ultimoAlAire = alAire;
        sonar(alAire);
        mostrarRecurso(escena.recurso || null);
        espera.classList.toggle('nada', alAire.length > 0 || escena.vacio);
        if (escena.vacio) empezar();
        console.log('escena: ' + escena.layout + ' · cámaras ' + JSON.stringify(Array.from(camaras.keys())) + ' · al aire ' + JSON.stringify(alAire) + ' · con audio ' + JSON.stringify(Array.from(audios.keys())) + ' · participantes ' + room.remoteParticipants.size);
        if (alAire.length > 0) empezar();
      }

      room.on(RoomEvent.TrackSubscribed, componer);
      room.on(RoomEvent.AudioPlaybackStatusChanged, () => { if (!room.canPlaybackAudio) room.startAudio().catch(() => {}); });
      room.on(RoomEvent.TrackSubscriptionFailed, (sid, p, reason) => console.log('escena: no se pudo suscribir a ' + p.identity + ' ' + (reason || '')));
      room.on(RoomEvent.TrackPublished, (pub, p) => console.log('escena: ' + p.identity + ' publicó ' + pub.source));
      room.on(RoomEvent.TrackUnsubscribed, componer);
      room.on(RoomEvent.TrackMuted, componer);
      room.on(RoomEvent.TrackUnmuted, componer);
      room.on(RoomEvent.ParticipantConnected, componer);
      room.on(RoomEvent.ParticipantDisconnected, componer);
      room.on(RoomEvent.RoomMetadataChanged, leerMetadata);
      // Quién habla (para el rótulo automático): el más activo de los que están al aire
      room.on(RoomEvent.ActiveSpeakersChanged, (speakers) => {
        const alAire = ultimoAlAire.map((id) => id.replace(/#pantalla$/, ''));
        const s = speakers.find((sp) => !sp.isLocal && alAire.includes(sp.identity));
        if (s && s.identity !== hablando) { hablando = s.identity; pintarRotulo(); }
      });
      // Si se cae la conexión antes de haber empezado, se reintenta en vez de cerrar el egress
      room.on(RoomEvent.Disconnected, (motivo) => {
        console.log('desconectado', motivo);
        if (grabando) { console.log('END_RECORDING'); } else { conectar(); }
      });

      let intentos = 0;
      async function conectar() {
        intentos += 1;
        if (intentos > 6) { espera.textContent = 'No se pudo conectar con el servidor de video'; console.log('END_RECORDING'); return; }
        espera.textContent = intentos > 1 ? 'Reconectando (' + intentos + ')…' : 'Esperando la cámara…';
        try {
          await room.connect(url, token, { autoSubscribe: true });
          leerMetadata();
          componer();
        } catch (e) {
          console.error('conexión fallida', e && e.message);
          setTimeout(conectar, 3000);
        }
      }
      // Vista previa local sin sala (?demo=JSON con la metadata): para probar diseños
      if (q.get('demo')) {
        const meta = q.get('demo');
        Object.defineProperty(room, 'metadata', { get: () => meta, configurable: true });
        leerMetadata();
        return;
      }
      await conectar();
      // Si nadie publica en 20 s pero hay conexión, igual se empieza (pantalla de espera) para que Facebook reciba señal
      setTimeout(() => { if (room.state === 'connected') empezar(); }, 20000);
    }
    main().catch((e) => { $('espera').textContent = 'No se pudo conectar: ' + e.message; console.error(e); });
  </script>
</body>
</html>
